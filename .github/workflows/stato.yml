name: Stato del caricamento

# A mano: quante stagioni di tutta Italia sono state caricate, quanti atleti e squadre.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stato
        working-directory: controller
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RTDB_URL: https://nuotifica-default-rtdb.europe-west1.firebasedatabase.app
        run: |
          node src/stato-caricamento.js
          node src/diagnosi-classifiche.js
      - name: Indirizzi
        run: |
          for u in https://cloro.web.app/ https://cloro.web.app/js/app.js https://nuotifica.web.app/ https://nuotifica.web.app/sw.js https://nuotifica.web.app/js/app.js; do
            echo "$u -> $(curl -s -o /tmp/r -w '%{http_code} %{size_download}B' "$u") $(head -c 120 /tmp/r | tr '\n' ' ')"
          done | tee /tmp/indirizzi.txt
          echo "::notice title=Indirizzi::$(tr '\n' ';' < /tmp/indirizzi.txt | sed 's/%/%25/g')"

