name: Verifica dei tempi

# I nostri tempi contro quelli della federazione: graduatorie prese a caso, ogni tempo controllato nella
# scheda dell'atleta, nella squadra della stagione e nei migliori di sempre della squadra.
# Nel riassunto solo i numeri; gli esempi (con nomi e tempi) escono solo cifrati.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      quante:
        description: 'Quante graduatorie controllare'
        required: false
        default: '80'
      atleti:
        description: 'Atleti da guardare da vicino (chiavi separate da virgola, facoltativo)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: verifica
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Togli i rami di prove vecchie
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/indagine-esiti" 2>/dev/null || true
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verifica
        working-directory: controller
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RTDB_URL: https://nuotifica-default-rtdb.europe-west1.firebasedatabase.app
          FONTI: ${{ secrets.FONTI }}
          QUANTE: ${{ inputs.quante || '80' }}
          ATLETI: ${{ inputs.atleti }}
        run: |
          mkdir -p "$RUNNER_TEMP/esiti"
          node src/verifica.js "$QUANTE" 40 "$RUNNER_TEMP/esiti/esempi.json" "$ATLETI"
      - name: Esempi (solo cifrati)
        run: |
          cat > "$RUNNER_TEMP/pub.pem" <<'CHIAVE'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqm39n6Y/tgiSblTY0JoX
          n7VpWtMMXHDnP6rlr0H5+5JroOtu3+kt9QkPrY8PJ4S9Ewz+Px/iIgoVBGRtV+gx
          ekcjqyE8HZvq0vJRJRv6nmzaBlKBuU1pCpb+pUoLz9Tuf9YmW7ha49fJ6PAK+mb0
          ISa8tmtVAvqI6Ekaq+8uJbd+nf7PCXX5jvaAiikAPUtrgAtPz50oCsMfNBEnV8YP
          lEvA63uoABWLqS+1A8XEFSsm7L6RgmtuV/ivtNw1TImSObTaCt3TidA+Qq78HFtT
          lemj8na6M1oI4u7nL6FVHqP1f0+Wkc0V+aV6Ddi7OLRp2czwFQN0e9hGxSGKa/uv
          T1cpczZyyMb4AB2pyQiLrwytqZfSS/MqFBlmm06jNzCQq3j5W93FI2Povx/TMJH2
          aIPxLAUXBgMOuCcdjiYYyIr38azln4JMDEjUkloPhuLlaU+cuFcMGkdf8GVDKSyS
          /NbotyFrJaG5rU7klUl/wD1GVjdxvx7HRMRMtAeF92ENAgMBAAE=
          -----END PUBLIC KEY-----
          CHIAVE
          cd "$RUNNER_TEMP"
          tar czf esiti.tgz esiti
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in esiti.tgz -out esiti.tgz.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.bin.enc
          mkdir cifrati && mv esiti.tgz.enc k.bin.enc cifrati/
          rm -rf esiti esiti.tgz k.bin
          cd cifrati
          git init -q -b verifica-esiti
          git config user.name "Cloro"
          git config user.email "noreply@cloro.web.app"
          git add -A
          git commit -qm "Esempi cifrati"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" verifica-esiti
