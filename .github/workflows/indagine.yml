name: Indagine (temporaneo)

# Prova se il sito FIN risponde ai server di GitHub con strumenti diversi
# (blocco per indirizzo IP oppure per tipo di programma). Salva solo le risposte su un ramo a parte.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - name: Script della pagina graduatorie
        run: |
          mkdir -p "$RUNNER_TEMP/out"; O="$RUNNER_TEMP/out"
          B=https://www.federnuoto.it
          for f in templates/ifrit/js/app.js templates/ifrit/svi/svi.js templates/ifrit/svi/override.js templates/ifrit/svi/settebello.js; do
            n=$(echo "$f" | tr '/' '_')
            curl -s --http2 -o "$O/$n" -w "$f %{http_code}\n" "$B/$f" >> $O/esiti.txt || true
          done
          grep -n -o -E ".{0,300}(solrconnect|data-com|graduatori).{0,400}" $O/*.js > $O/trovati.txt || true
          cat $O/esiti.txt; wc -l $O/trovati.txt

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine accesso FIN"
          git push -f origin indagine
