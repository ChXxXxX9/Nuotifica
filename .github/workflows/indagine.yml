name: Indagine cronometraggio nazionale (temporaneo)
on:
  push:
    branches: [indagine]
permissions:
  contents: write
jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Pagine e dati
        run: |
          set +e
          rm -rf out; mkdir -p out s; UA="Cloro/1.0 (+https://cloro.web.app)"
          B='https://fin2026.microplustiming.com/export/NU_2026_11_12-14_Riccione/NU'
          curl -s --max-time 30 -A "$UA" -o s/c.json "$B/Contatori.json"
          python3 -I - <<'PY' > out/contatori.txt
          import json, collections
          d = json.loads(open('s/c.json','rb').read().decode('utf-8-sig'))
          righe = d['contatori']
          print(len(righe))
          per = collections.defaultdict(list)
          for r in righe: per[r['cod']].append(r)
          for k, v in per.items():
              print('##', k, len(v))
              for r in v[:6]: print(r['c0'], r['c1'], r['c2'], r['c3'], r['od'], r['nomefile'], r['counter'])
          json.dump({k: [r['nomefile'] for r in v[:2]] for k, v in per.items()}, open('s/scegli.json', 'w'))
          PY
          python3 -I - <<'PY' > s/lista.txt
          import json
          for k, v in json.load(open('s/scegli.json')).items():
              for n in v: print(k + '\t' + n)
          PY
          while IFS=$'\t' read -r cod nome; do
            u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$nome")
            n="$cod-$(echo "$nome" | tr ' /' '__')"
            c=$(curl -s --max-time 20 -A "$UA" -o "s/$n" -w '%{http_code}' "$B/$u")
            echo "$c $(wc -c < "s/$n") $cod $nome" >> out/esiti.txt
            [ "$c" = "200" ] && python3 -I scripts/schema.py "s/$n" > "out/schema-$n.txt"
          done < s/lista.txt
          cat out/esiti.txt
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti" && git push origin HEAD:indagine
