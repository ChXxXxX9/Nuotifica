name: Indagine AquatiX (temporaneo)

# Guarda solo le pagine pubbliche di aquatix.it (nessun accesso, nessuna app).
on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Dati di una gara (come li chiede il sito pubblico)
        run: |
          rm -rf out; mkdir -p out; UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          G=98cffe1039132decfb898faca74a089c1eeeed8f
          curl -s --max-time 30 -A "$UA" -H "Origin: https://aquatix.it" -D out/intestazioni.txt -o out/gara.json -w "%{http_code} %{size_download} %{time_total}\n" "https://aquatix.nextadv.it/admin/gara/$G" | tee out/esiti.txt
          python3 - <<'PY' > out/struttura.txt
          import json
          d=json.load(open('out/gara.json'))
          print('chiavi', list(d.keys()))
          r=d.get('results',{})
          print('categorie', list(r.keys())[:20])
          for cat,ev in list(r.items())[:1]:
              print('gare in', cat, list(ev.keys())[:30])
              for gara,batt in list(ev.items())[:1]:
                  print('batterie', list(batt.keys()))
                  for b,atl in list(batt.items())[:1]:
                      a=atl[0]
                      a2=json.loads(json.dumps(a))
                      if 'athlete' in a2:
                          a2['athlete']={k:(v if k in ('year','nat') else 'X') for k,v in a2['athlete'].items()}
                      print(json.dumps(a2,ensure_ascii=False,indent=1)[:3000])
          for k,v in d.items():
              if k!='results': print(k, json.dumps(v,ensure_ascii=False)[:600])
          PY
          cat out/struttura.txt | head -120
          rm out/gara.json
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -qm "Esiti indagine AquatiX" && git push origin HEAD:indagine
