name: Indagine fonti nazionali (temporaneo)

# Guarda solo pagine pubbliche: calendario e "live" FIN, pagina risultati FIN, Microplus.
on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Richieste
        run: |
          rm -rf out; mkdir -p out; UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          F='https://www.federnuoto.it/index.php?option=com_solrconnect&currentpage=1&format=json'
          prova() { local nome=$1; shift; curl -s --http2 --max-time 25 -A "$UA" -o "out/$nome.raw" -w "$nome %{http_code} %{size_download}\n" "$@" >> out/esiti.txt || echo "$nome ERRORE" >> out/esiti.txt; }
          prova ris -X POST "$F&view=risultati" --data-urlencode 'solr[settore]=NUO' --data-urlencode "solr[id_evento]=150239"
          python3 -I scripts/primo.py out/ris.raw | tee out/parametri.txt
          ARGS=$(head -1 out/parametri.txt)
          eval "prova det -X POST \"\$F&view=dettagliorisultati\" --data-urlencode 'solr[settore]=NUO' $ARGS"
          python3 -I scripts/risultati.py out/det.raw > out/det.txt 2>&1 || true
          cat out/esiti.txt
          rm -f out/*.raw
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti indagine fonti nazionali" && git push origin HEAD:indagine
