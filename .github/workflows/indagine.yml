name: Indagine (temporaneo)

# Scarica le pagine pubbliche della FIN su graduatorie e risultati per capire come funzionano.
# Salva solo l'HTML grezzo su un ramo a parte ("indagine"), non tocca il sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Scarica le pagine
        run: |
          mkdir -p "$RUNNER_TEMP/out"; ln -s "$RUNNER_TEMP/out" out
          UA="Mozilla/5.0 (Nuotifica; indagine una tantum)"
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"
          for p in \
            "fin-www|https://www.federnuoto.it/home/nuoto/graduatorie.html" \
            "fin-rest|https://rest.federnuoto.web.coninet.it/home/nuoto/graduatorie.html" \
            "fin-rest-stagione|https://rest.federnuoto.web.coninet.it/home/nuoto/graduatorie-stagione-2026-2027.html"; do
            nome="${p%%|*}"; url="${p#*|}"
            curl -sSL -A "$CH" -H "Accept-Language: it-IT,it;q=0.9" -H "Accept: text/html" -D "out/$nome.headers" -o "out/$nome.html" --max-time 30 "$url" || echo "errore $url" >> out/errori.txt
          done
          ls -la out

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          rm -f out; cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine pagine FIN"
          git push -f origin indagine
