name: Indagine cronometraggio nazionale (temporaneo)
on:
  push:
    branches: [indagine]
permissions:
  contents: write
jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Pagine e dati
        run: |
          set +e
          rm -rf out; mkdir -p out s; UA="Cloro/1.0 (+https://cloro.web.app)"
          H='https://fin2026.microplustiming.com'
          B="$H/export/NU_2026_11_12-14_Riccione/NU"
          for f in "NUASF002RIEP01 001.JSON" "NUASF002CLAS01 001.JSON" "NUASF002CLAS05 001.JSON" "NUASF002STAR05 001.JSON" "NUASF005RIEP07 001.JSON" "NUASF005CLAS07 001.JSON" "NUASF001STAR01 001.JSON" "NUASF003CLAS05 001.JSON"; do
            n=$(echo "$f" | tr ' ' '_')
            curl -s --max-time 20 -A "$UA" -o "s/$n" "$B/$(echo "$f" | sed 's/ /%20/g')"
            python3 -I scripts/tabella.py "s/$n" > "out/t-$n.txt" 2>&1
          done
          for f in "ScheduleByEvent_ASF.JSON" "orario.JSON" "ScheduleByDate_1.JSON"; do
            curl -s --max-time 20 -A "$UA" -o "s/$f" "$B/$f"; python3 -I scripts/schema.py "s/$f" > "out/schema-$f.txt"
          done
          curl -s --max-time 20 -A "$UA" -o s/root.html "$H/"; echo "root $(wc -c < s/root.html)" > out/esiti.txt
          grep -o -E 'href="[^"]+"' s/root.html | sort -u | head -60 > out/root-link.txt
          curl -s --http2 --max-time 30 -A "$UA" -o s/fin.html 'https://www.federnuoto.it/home/nuoto/risultati-e-classifiche-nuoto/2026-2027-2.html'
          grep -o -E 'https?://[^"'"'"' ]+\.php' s/fin.html | sort -u > out/link-fin.txt
          grep -o -E '.{0,300}NU_2026_11_12-14.{0,300}' s/fin.html | head -3 > out/fin-contesto.txt
          cat out/esiti.txt
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti" && git push origin HEAD:indagine
