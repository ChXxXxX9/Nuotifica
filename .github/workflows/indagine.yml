name: Indagine (temporaneo)

# Prova se il sito FIN risponde ai server di GitHub con strumenti diversi
# (blocco per indirizzo IP oppure per tipo di programma). Salva solo le risposte su un ramo a parte.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - name: Prova della ricerca graduatorie
        run: |
          mkdir -p "$RUNNER_TEMP/out"; O="$RUNNER_TEMP/out"
          API="https://www.federnuoto.it/index.php?option=com_solrconnect&currentpage=1&format=json"
          COMUNI=(--data-urlencode "solr[settore]=NUO" --data-urlencode "solr[id_comitato]=12" --data-urlencode "solr[id_lunghezza_vasca]=1" --data-urlencode "solr[limit]=20")
          for ua in "Nuotifica/1.0 (+https://nuotifica.web.app)" "curl/8.5.0"; do
            curl -s --http2 -A "$ua" -o "$O/prova-ua.json" -w "UA [$ua] -> %{http_code}\n" -X POST "$API&view=grricerca" "${COMUNI[@]}" \
              --data-urlencode "solr[sesso]=M" --data-urlencode "solr[kindtime]=3" --data-urlencode "solr[stagione]=2026" --data-urlencode "solr[codice_gara]=01" >> $O/esiti.txt
          done
          UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          # 1) graduatoria 100 SL maschi, Lazio, vasca corta, stagione 2026/27
          curl -s --http2 -A "$UA" -o "$O/grad-100sl.json" -X POST "$API&view=grricerca" "${COMUNI[@]}" \
            --data-urlencode "solr[sesso]=M" --data-urlencode "solr[kindtime]=3" --data-urlencode "solr[stagione]=2026" --data-urlencode "solr[codice_gara]=01"
          # 2) tutte le prestazioni del Lazio degli ultimi 15 giorni (tutte le gare)
          curl -s --http2 -A "$UA" -o "$O/recenti.json" -X POST "$API&view=grricerca" "${COMUNI[@]}" \
            --data-urlencode "solr[sesso]=F" --data-urlencode "solr[kindtime]=4" --data-urlencode "solr[dal]=28/10/2026" --data-urlencode "solr[al]=12/11/2026" --data-urlencode "solr[all]=1"
          # 3) vista iniziale
          curl -s --http2 -A "$UA" -o "$O/iniziale.json" -X POST "$API&view=griniziale" --data-urlencode "solr[settore]=NUO"
          ls -la $O; cat $O/esiti.txt
          for f in $O/*.json; do echo "== $f"; head -c 600 "$f"; echo; done

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine accesso FIN"
          git push -f origin indagine
