name: Indagine materiali (temporaneo)

on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  materiali:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tempi base 09.2026
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p out sorgenti
          curl -fsSL -A "Nuotifica/1.0 (+https://nuotifica.web.app)" -o sorgenti/bt.pdf "https://resources.fina.org/fina/document/2026/09/05/9b48fb98-233c-4ce9-b67b-bc6163319bbd/Points-Base-times-SCM-and-LCM-2026_09.2026.pdf"
          pdftotext -layout sorgenti/bt.pdf out/tempi-base-2026-09.txt
          head -40 out/tempi-base-2026-09.txt
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Materiali" && git push origin HEAD:indagine
