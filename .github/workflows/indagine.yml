name: Indagine cronometraggio nazionale (temporaneo)
on:
  push:
    branches: [indagine]
permissions:
  contents: write
jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Pagine e dati
        run: |
          set +e
          rm -rf out; mkdir -p out s; UA="Cloro/1.0 (+https://cloro.web.app)"
          P='https://fin2026.microplustiming.com/NU_2026_11_12-14_Riccione.php'
          BASE="${P%/*}"; NOME=$(basename "$P" .php)
          curl -s --max-time 30 -A "$UA" -o s/w.html "${P%.php}_web.php"
          curl -s --max-time 30 -A "$UA" -o s/p.html "$P"
          # come si forma il percorso dei dati
          grep -n -o -E '.{0,200}pathManifestazione.{0,200}' s/w.html s/p.html | head -20 > out/man.txt
          grep -n -o -E '.{0,160}(getJSON|\$\.ajax|fetch\(|XMLHttpRequest|url ?:).{0,200}' s/w.html | head -40 > out/caricamenti.txt
          grep -o -E 'src="[^"]+\.js[^"]*"' s/w.html | sort -u > out/script.txt
          for js in $(grep -o -E 'src="[^"]+\.js' s/w.html | cut -d'"' -f2 | grep -v -E '^https?://' | sort -u | head -12); do
            n=$(echo "$js" | tr '/' '_'); curl -s --max-time 20 -A "$UA" -o "s/$n" "$BASE/$js"
            grep -o -E '.{0,160}(pathExport|pathManifestazione|\.json|NU/).{0,200}' "s/$n" | head -40 > "out/js-$n.txt"
          done
          # candidati per la cartella della manifestazione
          for MAN in "$NOME" "${NOME#NU_}" "$(echo $NOME | tr 'a-z' 'A-Z')"; do
            for f in "export/$MAN/NU/Contatori.json" "export/$MAN/NU/CounterGenerale.json" "export/$MAN/Contatori.json"; do
              n=$(echo "$f" | tr '/' '_')
              c=$(curl -s --max-time 20 -A "$UA" -o "s/$n" -w '%{http_code}' "$BASE/$f")
              echo "$c $(wc -c < s/$n) $f" >> out/esiti.txt
              if [ "$c" = "200" ]; then python3 -I scripts/schema.py "s/$n" > "out/schema-$n.txt"; fi
            done
          done
          cat out/esiti.txt
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti" && git push origin HEAD:indagine
