name: Indagine AquatiX (temporaneo)

# Guarda solo le pagine pubbliche di aquatix.it (nessun accesso, nessuna app).
on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Parziali in una gara di categoria assoluta
        run: |
          rm -rf out; mkdir -p out; UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          curl -s --max-time 30 -A "$UA" -o gara.json -w "%{http_code} %{size_download}\n" "https://aquatix.nextadv.it/admin/gara/72a5f6a67cf27cd7cd3f4ef0b372ea6b03b6b152" | tee out/esiti.txt
          python3 - <<'PY' > out/parziali.txt
          import json, collections
          r=json.load(open('gara.json'))['results']
          tot=0; conpar=0; esempio=None; tipi=collections.Counter(); campi=collections.Counter()
          for cat,ev in r.items():
              for gara,batt in ev.items():
                  for b,atl in batt.items():
                      for a in atl:
                          tot+=1; tipi[a.get('type')]+=1
                          m=a.get('MemFields') or []
                          inter=[x for x in m if x.get('M')!='FINISH' and x.get('V')]
                          for x in m:
                              for k,v in x.items():
                                  if v: campi[k]+=1
                          if inter:
                              conpar+=1
                              if esempio is None: esempio=(cat,gara,a.get('time'),m)
          print('atleti',tot,'con parziali',conpar,'tipi',dict(tipi),'campi pieni',dict(campi))
          print('categorie',list(r.keys()))
          print('esempio',json.dumps(esempio,ensure_ascii=False)[:1500])
          PY
          cat out/parziali.txt
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -qm "Esiti indagine AquatiX" && git push origin HEAD:indagine
