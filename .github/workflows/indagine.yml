name: Indagine fonti nazionali (temporaneo)

# Guarda solo pagine pubbliche: calendario e "live" FIN, pagina risultati FIN, Microplus.
on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Richieste
        run: |
          rm -rf out; mkdir -p out; UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          F='https://www.federnuoto.it/index.php?option=com_solrconnect&currentpage=1&format=json'
          prova() { n=$1; shift; curl -s --http2 --max-time 25 -A "$UA" -o "out/$n.raw" -w "$n %{http_code} %{size_download}\n" "$@" >> out/esiti.txt || echo "$n ERRORE" >> out/esiti.txt; }
          prova cal -X POST "$F&view=calendario" --data-urlencode 'solr[settore]=NUO'
          prova mpev 'https://microplus.it/events/'
          prova fin2627 'https://www.federnuoto.it/home/nuoto/risultati-e-classifiche-nuoto/2026-2027-2.html'
          cat out/esiti.txt
          python3 -I scripts/html.py out/cal.raw 7000 'Risultati' > out/cal_html.txt
          python3 -I scripts/html.py out/cal.raw 3000 'Dettaglio' > out/cal_html_dettaglio.txt
          grep -o -E '(data-[a-z_-]+|onclick|href)="[^"]{0,200}"' out/cal_html.txt | sort | uniq -c | sort -rn | head -40 > out/cal_attributi.txt || true
          python3 -I scripts/estrai.py out/mpev.raw > out/mpev.txt
          python3 -I scripts/html.py out/mpev.raw 6000 'event' > out/mpev_html.txt
          python3 -I scripts/estrai.py out/fin2627.raw > out/fin2627.txt
          grep -o -E 'href="[^"]*(\.pdf|download|risultat|live|microplus)[^"]*"' out/fin2627.raw | sort -u | head -60 > out/fin2627_link.txt || true
          rm out/*.raw
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti indagine fonti nazionali" && git push origin HEAD:indagine
