name: Indagine materiali (temporaneo)

on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  materiali:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Font, tempi base e campioni anonimi
        run: |
          rm -rf out; mkdir -p out/fonts out/campioni sorgenti
          pip install --quiet fonttools brotli
          sudo apt-get install -y -qq poppler-utils >/dev/null
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o sorgenti/unbounded.ttf "$base/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL -o sorgenti/manrope.ttf "$base/manrope/Manrope%5Bwght%5D.ttf"
          curl -fsSL -o out/fonts/OFL-Unbounded.txt "$base/unbounded/OFL.txt"
          curl -fsSL -o out/fonts/OFL-Manrope.txt "$base/manrope/OFL.txt"
          caratteri="U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+25B2-25BC,U+25CF"
          for f in unbounded manrope; do
            pyftsubset "sorgenti/$f.ttf" --unicodes="$caratteri" --layout-features='*' --flavor=woff2 --output-file="out/fonts/$f.woff2"
            pyftsubset "sorgenti/$f.ttf" --unicodes="$caratteri" --layout-features='*' --output-file="out/fonts/$f-sub.ttf"
          done
          UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          curl -fsSL -A "$UA" -o sorgenti/bt.pdf "https://resources.fina.org/fina/document/2026/01/27/3886f5b2-5bcf-464e-a626-059be2ed4567/Points-Base-times-SCM-and-LCM-2026_01.2026.pdf" && pdftotext -layout sorgenti/bt.pdf out/tempi-base-2026.txt || echo "pdf non scaricato" > out/tempi-base-2026.txt
          curl -s --max-time 30 -A "$UA" -o sorgenti/home.html "https://aquatix.it/"
          python3 - <<'PY'
          import re
          t=open('sorgenti/home.html',encoding='utf-8',errors='replace').read()
          i=t.find('ultime_gare_1'); j=t.find('</ul>', i)
          open('out/campioni/elenco.html','w').write(t[i-200:j+5])
          PY
          curl -s --max-time 30 -A "$UA" -o sorgenti/g1.json "https://aquatix.nextadv.it/admin/gara/98cffe1039132decfb898faca74a089c1eeeed8f"
          curl -s --max-time 30 -A "$UA" -o sorgenti/g2.json "https://aquatix.nextadv.it/admin/gara/72a5f6a67cf27cd7cd3f4ef0b372ea6b03b6b152"
          python3 -I scripts/anonimizza.py live sorgenti/g1.json out/campioni/gara-esordienti.json
          python3 -I scripts/anonimizza.py live sorgenti/g2.json out/campioni/gara-assoluti.json
          F='https://www.federnuoto.it/index.php?option=com_solrconnect&currentpage=1&format=json'
          curl -s --http2 --max-time 25 -A "$UA" -o out/campioni/fin-calendario.json -X POST "$F&view=calendario" --data-urlencode 'solr[settore]=NUO'
          curl -s --http2 --max-time 25 -A "$UA" -o out/campioni/fin-evento.json -X POST "$F&view=risultati" --data-urlencode 'solr[settore]=NUO' --data-urlencode 'solr[id_evento]=150239'
          curl -s --http2 --max-time 25 -A "$UA" -o sorgenti/det.json -X POST "$F&view=dettagliorisultati" --data-urlencode 'solr[settore]=NUO' --data-urlencode 'solr[id_evento]=150239' --data-urlencode 'solr[codice_gara]=00' --data-urlencode 'solr[id_categoria]=330' --data-urlencode 'solr[sesso]=M'
          python3 -I scripts/anonimizza.py fin sorgenti/det.json out/campioni/fin-dettaglio.json
          ls -la out out/fonts out/campioni; head -60 out/tempi-base-2026.txt
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Materiali" && git push origin HEAD:indagine
