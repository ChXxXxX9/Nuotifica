name: Indagine (temporaneo)

# Scarica le pagine pubbliche della FIN su graduatorie e risultati per capire come funzionano.
# Salva solo l'HTML grezzo su un ramo a parte ("indagine"), non tocca il sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Scarica le pagine
        run: |
          mkdir -p "$RUNNER_TEMP/out"; ln -s "$RUNNER_TEMP/out" out
          UA="Mozilla/5.0 (Nuotifica; indagine una tantum)"
          W="https://www.finlazio.it/wp-json/wp/v2/posts?per_page=50&_fields=id,date,title,link,content"
          curl -sSL -A "$UA" -o out/cerca-microplus.json --max-time 30 "$W&search=microplus" || true
          curl -sSL -A "$UA" -o out/cerca-temporeale.json --max-time 30 "$W&search=tempo%20reale" || true
          curl -sSL -A "$UA" -o out/cerca-live.json --max-time 30 "$W&search=live" || true
          # in tutti i post recenti: link a siti di risultati live
          for pg in 1 2 3 4; do
            curl -sSL -A "$UA" --max-time 30 "https://www.finlazio.it/wp-json/wp/v2/posts?per_page=100&page=$pg&_fields=id,date,title,content" >> out/recenti.json || true
            echo >> out/recenti.json
          done
          grep -oE 'https?://[a-zA-Z0-9.-]*(microplus|ficr|swimify|livetiming|risultati)[a-zA-Z0-9./_?=&%-]*' out/recenti.json | sort | uniq -c | sort -rn > out/link-live.txt || true
          ls -la out

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          rm -f out; cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine pagine FIN"
          git push -f origin indagine
