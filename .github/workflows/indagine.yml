name: Indagine (temporaneo)

# Scarica le pagine pubbliche della FIN su graduatorie e risultati per capire come funzionano.
# Salva solo l'HTML grezzo su un ramo a parte ("indagine"), non tocca il sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Scarica le pagine
        run: |
          mkdir -p "$RUNNER_TEMP/out"; ln -s "$RUNNER_TEMP/out" out
          UA="Mozilla/5.0 (Nuotifica; indagine una tantum)"
          for p in \
            "fin2026-index|https://fin2026.microplustiming.com/" \
            "fin2027-index|https://fin2027.microplustiming.com/" \
            "fin2026-index-php|https://fin2026.microplustiming.com/index.php" \
            "fin2023-potenza|https://fin2023.microplustiming.com/NU_2023_10_31-11_01_Potenza.php" \
            "live-index|https://live.microplustiming.com/" \
            "microplus-robots|https://fin2026.microplustiming.com/robots.txt"; do
            nome="${p%%|*}"; url="${p#*|}"
            curl -sSL -A "$UA" -D "out/$nome.headers" -o "out/$nome.html" --max-time 30 "$url" || echo "errore $url" >> out/errori.txt
          done
          ls -la out

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          rm -f out; cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine pagine FIN"
          git push -f origin indagine
