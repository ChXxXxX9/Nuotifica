name: Indagine (temporanea)

# Pulizia: cancella il ramo temporaneo con gli esiti cifrati dell'ultima prova.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancella il ramo temporaneo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/indagine-esiti" || true
