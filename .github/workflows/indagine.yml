name: Prova del sito (temporaneo)
on:
  push:
    branches: [indagine]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apri il sito come un telefono
        run: |
          mkdir -p out && cd out
          npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > prova.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 390, height: 844 } });
            const errori = [];
            p.on('pageerror', (e) => errori.push(e.message));
            p.on('console', (m) => { if (m.type() === 'error') errori.push(m.text()); });
            await p.goto('https://nuotifica.web.app/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(2500);
            await p.screenshot({ path: 'sito.png' });
            const titolo = await p.title();
            const manifest = await (await p.request.get('https://nuotifica.web.app/manifest.webmanifest')).json();
            require('fs').writeFileSync('esito.txt', JSON.stringify({ titolo, nome: manifest.name, errori }, null, 1));
            await b.close();
          })();
          JS
          node prova.cjs && cat esito.txt
          rm -rf node_modules package*.json prova.cjs
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Prova del sito" && git push origin HEAD:indagine
