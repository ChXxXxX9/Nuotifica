name: Indagine fonti nazionali (temporaneo)

# Guarda solo pagine pubbliche: calendario e "live" FIN, pagina risultati FIN, Microplus.
on:
  push:
    branches: [indagine]

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Richieste
        run: |
          rm -rf out; mkdir -p out; UA="Nuotifica/1.0 (+https://nuotifica.web.app)"
          F='https://www.federnuoto.it/index.php?option=com_solrconnect&currentpage=1&format=json'
          prova() { local nome=$1; shift; curl -s --http2 --max-time 25 -A "$UA" -o "out/$nome.raw" -w "$nome %{http_code} %{size_download}\n" "$@" >> out/esiti.txt || echo "$nome ERRORE" >> out/esiti.txt; }
          prova cal -X POST "$F&view=calendario" --data-urlencode 'solr[settore]=NUO'
          python3 -I scripts/eventi.py out/cal.raw > out/eventi_oggi.txt
          L=$(grep -i -m1 'Gaetano Lanzi' out/eventi_oggi.txt | cut -d' ' -f1); echo "lanziB=$L" >> out/esiti.txt
          for x in "aquaniene:150239" "sapio:150090" "lanziB:$L"; do
            n=${x%%:*}; id=${x#*:}; [ -n "$id" ] && [ "$id" != "-" ] || continue
            prova "ris_$n" -X POST "$F&view=risultati" --data-urlencode 'solr[settore]=NUO' --data-urlencode "solr[id_evento]=$id"
            python3 -I scripts/risultati.py "out/ris_$n.raw" > "out/ris_$n.txt" 2>&1 || true
          done
          cat out/esiti.txt
          rm -f out/*.raw
      - name: Salva
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out && git commit -qm "Esiti indagine fonti nazionali" && git push origin HEAD:indagine
