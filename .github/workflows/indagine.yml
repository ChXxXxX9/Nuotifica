name: Indagine (temporaneo)

# Scarica le pagine pubbliche della FIN su graduatorie e risultati per capire come funzionano.
# Salva solo l'HTML grezzo su un ramo a parte ("indagine"), non tocca il sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indagine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Scarica le pagine
        run: |
          mkdir -p "$RUNNER_TEMP/out"; ln -s "$RUNNER_TEMP/out" out
          UA="Mozilla/5.0 (Nuotifica; indagine una tantum)"
          E=https://fin2023.microplustiming.com/export/NU_2023_10_31-11_01_Potenza/NU
          for p in \
            "live-index-2023|https://fin2023.microplustiming.com/live/NU/indexframe3_web.htm" \
            "live-index-2026|https://fin2026.microplustiming.com/live/NU/indexframe3_web.htm" \
            "contatori|$E/Contatori.json" \
            "categorie|$E/categorie.json" \
            "orario|$E/orario.json" \
            "counter-generale|$E/CounterGenerale.json"; do
            nome="${p%%|*}"; url="${p#*|}"
            curl -sSL -A "$UA" -D "out/$nome.headers" -o "out/$nome.txt" --max-time 30 "$url" || echo "errore $url" >> out/errori.txt
          done
          # il primo file di risultati elencato nei contatori, se c'è
          primo=$(grep -oE '"[A-Za-z0-9_]+\.json"' out/contatori.txt | grep -viE 'categorie|orario|contatori|counter' | head -3 | tr -d '"')
          for f in $primo; do curl -sSL -A "$UA" -o "out/dato_$f" --max-time 30 "$E/$f" || true; done
          ls -la out

      - name: Salva sul ramo indagine
        run: |
          git config user.name "nuotifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan indagine
          git rm -rfq --cached .
          rm -f out; cp -r "$RUNNER_TEMP/out" out
          git add out
          git commit -qm "Indagine pagine FIN"
          git push -f origin indagine
