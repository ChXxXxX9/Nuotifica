name: Pubblica il sito

# A ogni modifica dell'app (cartella public) o delle regole, pubblica tutto su Firebase.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/pubblica.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versione fissa di firebase-tools (prima era "@latest", cioè l'ultima uscita su npm al momento
  # della corsa: un pacchetto compromesso sarebbe partito con la chiave Firebase in mano).
  # Per aggiornarla: cambia solo questo numero.
  FIREBASE_TOOLS: firebase-tools@15.33.0

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Credenziali Firebase
        env:
          ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$ACCOUNT" > "$RUNNER_TEMP/account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/account.json" >> "$GITHUB_ENV"
          echo "PROGETTO=$(node -p "require(process.env.RUNNER_TEMP + '/account.json').project_id")" >> "$GITHUB_ENV"

      - name: Prepara Firestore (crea il database se manca)
        working-directory: controller
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node src/prepara.js

      - name: Indirizzo nuovo (cloro.web.app, o cloro14 se cloro è preso)
        id: sito
        working-directory: controller
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node src/sito.js

      - name: Collega i due indirizzi (nuovo e vecchio) all'app
        run: |
          cat > .firebaserc <<EOF2
          {"projects":{"default":"$PROGETTO"},"targets":{"$PROGETTO":{"hosting":{"app":["${{ steps.sito.outputs.sito }}"],"vecchio":["$PROGETTO"]}}}}
          EOF2
          cat .firebaserc

      - name: Pubblica sito, regole e indici
        run: |
          set -o pipefail
          if ! npx --yes "$FIREBASE_TOOLS" deploy --only hosting,firestore:rules,firestore:indexes \
               --project "$PROGETTO" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            # l'errore compare anche come annotazione della corsa
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/deploy.log" | tail -n 25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Pubblicazione::$msg"
            exit 1
          fi

      - name: Pulizia
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/account.json"
